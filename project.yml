name: VtuberTranslate
options:
  bundleIdPrefix: com.sswv
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.15.0"
targets:
  VtuberTranslate:
    type: application
    platform: macOS
    dependencies:
      - package: FluidAudio
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sswv.VtuberTranslate
        PRODUCT_NAME: VtuberTranslate
        CODE_SIGN_IDENTITY: "VtuberTranslate Dev"
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VtuberTranslate JP→KO
        CFBundleName: VtuberTranslate
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        NSSpeechRecognitionUsageDescription: "방송 음성을 인식하여 자막으로 번역하기 위해 음성 인식을 사용합니다."
  VtuberEval:
    type: application
    platform: macOS
    dependencies:
      - package: FluidAudio
    sources:
      - Sources/App/AppLanguage.swift
      - Sources/Speech/SpeechRecognizing.swift
      - Sources/Speech/AppleSpeechRecognizer.swift
      - Sources/Speech/FluidParakeetJaRecognizer.swift
      - Sources/Pipeline/GlossaryCorrector.swift
      - Sources/Pipeline/ConversationalStyle.swift
      - Eval
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sswv.VtuberEval
        PRODUCT_NAME: VtuberEval
        CODE_SIGN_IDENTITY: "VtuberTranslate Dev"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Eval/Info.plist
      properties:
        CFBundleIdentifier: com.sswv.VtuberEval
        CFBundleName: VtuberEval
        LSUIElement: true
        NSSpeechRecognitionUsageDescription: "평가 하니스가 자막 파이프라인 테스트를 위해 음성 인식을 사용합니다."
